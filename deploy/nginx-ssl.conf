# HTTPS (used once /etc/letsencrypt/live/games.zabanyad.com exists). Installed as /etc/nginx/sites-available/zabanyad-games
include /etc/nginx/snippets/zabanyad-games-maps.conf;

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name games.zabanyad.com;

    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://games.zabanyad.com$request_uri; }
}

server {
    # Ubuntu 24.04 ships nginx 1.24: http2 goes on the listen line
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name games.zabanyad.com;

    ssl_certificate     /etc/letsencrypt/live/games.zabanyad.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/games.zabanyad.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:zgssl:5m;
    add_header Strict-Transport-Security "max-age=31536000" always;

    include /etc/nginx/snippets/zabanyad-games-app.conf;
}
