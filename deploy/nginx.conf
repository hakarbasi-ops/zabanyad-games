# Installed by deploy/install.sh as /etc/nginx/sites-available/zabanyad-games
# Behind ArvanCloud CDN the visitor's IP arrives in the "ar-real-ip" header; without the CDN it is $remote_addr.
map $http_ar_real_ip $zg_client_ip {
    ""      $remote_addr;
    default $http_ar_real_ip;
}

map $http_x_forwarded_proto $zg_proto {
    ""      $scheme;
    default $http_x_forwarded_proto;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name games.zabanyad.com;

    client_max_body_size 64k;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $zg_client_ip;
        proxy_set_header X-Forwarded-For $zg_client_ip;
        proxy_set_header X-Forwarded-Proto $zg_proto;
        proxy_read_timeout 30s;
    }

    location /static/ {
        proxy_pass http://127.0.0.1:8000;
        expires 7d;
        add_header Cache-Control "public";
    }

    location = /admin { proxy_pass http://127.0.0.1:8000; add_header Cache-Control "no-store"; }
}
