# Visitor IP: Cloudflare sends CF-Connecting-IP, ArvanCloud sends ar-real-ip; direct visits use $remote_addr.
map $http_ar_real_ip $zg_ip_arvan {
    ""      $remote_addr;
    default $http_ar_real_ip;
}
map $http_cf_connecting_ip $zg_client_ip {
    ""      $zg_ip_arvan;
    default $http_cf_connecting_ip;
}
map $http_x_forwarded_proto $zg_proto {
    ""      $scheme;
    default $http_x_forwarded_proto;
}
