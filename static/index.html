<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>بازی‌های زبانیاد</title>
  <link rel="icon" href="/static/img/logo-mark.png">
  <link rel="stylesheet" href="/static/css/game.css">
</head>
<body>
  <header class="appbar">
    <div class="appbar-inner">
      <a class="brand" href="/"><img src="/static/img/logo-mark.png" alt=""><span class="brand-text">زبانیاد</span></a>
      <a class="mycodes" href="/my">🎟️ کدهای من</a>
    </div>
  </header>
  <main class="page">
    <div class="hero">
      <h2>بازی کن، تخفیف ببر!</h2>
      <p>یکی از بازی‌ها رو انتخاب کن و کد تخفیف خریدت از زبانیاد رو بگیر.</p>
    </div>
    <div class="game-list" id="list"><div class="closed">…</div></div>
  </main>
  <script src="/static/js/common.js"></script>
  <script src="/static/js/otp.js"></script>
  <script>
    (async () => {
      const { api, el, jalaliDate, fa } = window.ZG;
      ZG.visit("home");
      const list = document.getElementById("list");
      const icons = { wheel: "🎡", scratch: "🎟️", quiz: "🔤", chest: "🎁", slot: "🎰", wordle: "🧩", vault: "🔐" };
      try {
        const { games, focus, jackpot } = await api("/api/games");
        if (focus) list.before(el("a", { class: "focus-banner", href: `/g/${encodeURIComponent(focus.slug)}` }, focus.message || focus.title, " ←"));
        if (jackpot && jackpot.length) {
          list.after(el("section", { class: "jackpot" }, el("h3", {}, "🏆 برنده‌های ۹۰٪ جمعه سیاه"),
            el("ol", {}, jackpot.slice(0, 10).map((w) => el("li", {}, el("span", { class: "m" }, fa(w.mobile)),
              el("span", {}, w.game), el("small", {}, jalaliDate(w.at, true)))))));
        }
        list.replaceChildren(...(games.length ? games.map((g) =>
          el("a", { class: `game-link kind-${g.kind} ${g.theme === "bf" ? "bf-card" : ""}`, href: `/g/${encodeURIComponent(g.slug)}` },
            g.theme === "bf" ? el("span", { class: "tag" }, "BLACK FRIDAY") : "",
            el("b", {}, g.title), el("span", {}, g.subtitle),
            g.soon ? el("span", { class: "soon" }, `به‌زودی · شروع ${jalaliDate(g.starts_at, true)}`)
              : g.theme === "bf" && g.ends_at ? el("span", { class: "soon" }, `فقط تا ${jalaliDate(g.ends_at)}`) : "",
            el("i", { class: "icon", "aria-hidden": "true" }, icons[g.kind] || "🎁"))) :
          [el("div", { class: "card closed" }, "فعلاً بازی فعالی نداریم. به‌زودی برمی‌گردیم!")]));
      } catch (e) {
        list.replaceChildren(el("div", { class: "card closed" }, e.message));
      }
    })();
  </script>
</body>
</html>
