<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#6c4cf1">
  <title>بازی‌های زبانیاد</title>
  <link rel="stylesheet" href="/static/css/game.css">
</head>
<body>
  <main class="page">
    <a class="brand" href="/"><span class="brand-dot">ز</span>زبانیاد</a>
    <h1>بازی کن، تخفیف ببر!</h1>
    <p class="subtitle">یکی از بازی‌ها رو انتخاب کن و کد تخفیف خریدت از زبانیاد رو بگیر.</p>
    <div class="game-list" id="list"><div class="closed">…</div></div>
  </main>
  <script src="/static/js/common.js"></script>
  <script>
    (async () => {
      const { api, el } = window.ZG;
      const list = document.getElementById("list");
      const icons = { wheel: "🎡", scratch: "🎟️", quiz: "🔤" };
      try {
        const { games } = await api("/api/games");
        list.replaceChildren(...(games.length ? games.map((g) =>
          el("a", { class: "game-link", href: `/g/${encodeURIComponent(g.slug)}` },
            el("span", { class: "icon" }, icons[g.kind] || "🎁"),
            el("div", {}, el("b", {}, g.title), el("span", {}, g.subtitle)))) :
          [el("div", { class: "card closed" }, "فعلاً بازی فعالی نداریم. به‌زودی برمی‌گردیم!")]));
      } catch (e) {
        list.replaceChildren(el("div", { class: "card closed" }, e.message));
      }
    })();
  </script>
</body>
</html>
